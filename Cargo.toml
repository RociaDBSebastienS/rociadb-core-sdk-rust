[package]
name = "rocia-db-sdk"
version = "0.6.0"
edition = "2024"
description = "RociaDB-SDK"
license = "Apache-2.0"
# EN: Mirrors the TypeScript SDK's `engines.node: ">=20"` in package.json:
# the lowest toolchain version this crate is declared to build with.
# 1.85 is the first stable release supporting `edition = "2024"`.
# FR: Miroir du `engines.node: ">=20"` du package.json du SDK TypeScript :
# la plus ancienne version de toolchain avec laquelle ce crate est declare
# compatible. 1.85 est la premiere version stable supportant
# `edition = "2024"`.
rust-version = "1.85"

[dependencies]
futures = "0.3.31"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pbjson-types = "0.8.0"
prost = "0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
tonic = { version = "0.14.2", features = ["transport", "tls-native-roots"] }
tonic-prost = "0.14.2"
tracing = "0.1"
uuid = { version = "1.19.0", features = ["v4"] }

[build-dependencies]
tonic-prost-build = { version = "0.14.2" }
prost-build = "0.14"
tonic-prost = "0.14.2"
